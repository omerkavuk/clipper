[project]
name = "clipper"
version = "1.3.0"
description = "News monitoring agent for a Claude plugin"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "requests>=2.32",
    "feedparser>=6.0",
    "pyyaml>=6.0",
    "trafilatura>=1.12",
    "agent-reach",
    "python-docx>=1.1",
]

[dependency-groups]
dev = ["pytest", "responses"]

[project.scripts]
clipper = "clipper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real network; runs only with CLIPPER_LIVE=1"]

[tool.uv.sources]
agent-reach = { url = "https://github.com/Panniantong/Agent-Reach/releases/download/v1.6.1/agent-reach.zip" }
